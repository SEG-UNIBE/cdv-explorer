version: 2

# Dependabot version updates are grouped aggressively to keep PR volume low.
# Regular update PRs target `dev`. Security update PRs remain separate and
# may still target the repository default branch when GitHub detects a
# vulnerable dependency.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /react
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 1
    groups:
      frontend-dependencies:
        patterns:
          - "*"
