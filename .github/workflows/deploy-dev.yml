name: Deploy DEV

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: CI workflow run id containing the react-build artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: cdv-explorer

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev'
      )
    environment:
      name: cloudflare-pages
      url: https://cdv-explorer.pages.dev/
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend artifact from CI
        uses: actions/download-artifact@v8
        with:
          name: react-build
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
          path: react/build

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy react/build --project-name="${CLOUDFLARE_PAGES_PROJECT}" --branch=dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
