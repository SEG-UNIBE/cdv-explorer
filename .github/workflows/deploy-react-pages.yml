name: CI / Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/deploy-react-pages.yml'
      - 'react/**'
      - 'main.py'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'ip_data/**/01_harvest/**'
      - 'ip_data/**/02_preprocess/**'
      - 'ip_data/**/03_analysis/**'
      - 'ip_data/**/04_postprocess/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'react/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate snapshot artifacts
        run: python scripts/validate_snapshots.py

  build:
    needs: [test, validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react

      - name: Build app
        run: npm run build
        working-directory: react

      - name: Prevent Jekyll processing
        run: touch react/build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: react/build

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
