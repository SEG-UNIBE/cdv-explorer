name: CI / Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - dev
    paths:
      - '.github/workflows/deploy-react-pages.yml'
      - 'react/**'
      - 'scripts/validate_artifacts.py'
      - 'ip_data/**/01_harvest/**'
      - 'ip_data/**/02_preprocess/**'
      - 'ip_data/**/03_analysis/**'
      - 'ip_data/**/04_postprocess/**'
  pull_request:
    branches:
      - main
      - master
      - dev
    paths:
      - '.github/workflows/deploy-react-pages.yml'
      - 'react/**'
      - 'scripts/validate_artifacts.py'
      - 'ip_data/**/01_harvest/**'
      - 'ip_data/**/02_preprocess/**'
      - 'ip_data/**/03_analysis/**'
      - 'ip_data/**/04_postprocess/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff check
        run: ruff check .

  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

  artifact-validation:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate snapshot artifacts
        run: python scripts/validate_artifacts.py

  test-frontend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: react

      - name: Generate frontend indexes
        run: npm run prebuild
        working-directory: react

      - name: Run frontend tests
        run: npm test -- --watchAll=false
        working-directory: react
        env:
          CI: true

  build:
    needs: [test-unit, artifact-validation, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react

      - name: Build app
        run: npm run build
        working-directory: react

      - name: Prevent Jekyll processing
        run: touch react/build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: react/build

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
