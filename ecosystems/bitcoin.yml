slug: bitcoin
display_name: Bitcoin
frontend:
  status: available
  description: Improvement proposals across the Bitcoin ecosystem
  ecosystem_description: >
    The Bitcoin ecosystem maintains two complementary series of improvement proposals:
    BIPs (Bitcoin Improvement Proposals) for core protocol changes and SLIPs
    (SatoshiLabs Improvement Proposals) for wallet-layer standards. Use the source
    picker to focus on one series, or analyze both together.

llm:
  model: gpt-5.4-mini
  reasoning_effort: 

sources:
  bips:
    display_name: Bitcoin Improvement Proposals
    proposal_acronym: BIP
    proposal_term_singular: Bitcoin Improvement Proposal
    proposal_term_plural: Bitcoin Improvement Proposals

    source_type: github_repo
    harvester: github_repo
    preprocessor: rfc_preamble
    compliance_checker: bip
    repository_owner: bitcoin
    repository_name: bips
    current_base_url: https://bips.dev

    harvest: ip_data/bitcoin/bips/01_harvest
    preprocess: ip_data/bitcoin/bips/02_preprocess
    analysis: ip_data/bitcoin/bips/03_analysis
    postprocess: ip_data/bitcoin/bips/04_postprocess

    document_prefix: bip
    primary_id_field: bip
    document_file_pattern: '^bip-\d{4}\.(mediawiki|md|rst)$'
    document_dir_pattern: '^bip-\d{4}$'
    reference_pattern: '\bBIP[-#\s]?(\d+)\b'
    max_proposal_id: 999
    stop_words_file: assets/stopwords/en_basic.txt
    frontend:
      compliance_standards:
        - key: bip2
          label: BIP2 Conformity
          color: "#e45756"
          hoverColor: "#b63f3e"
        - key: bip3
          label: BIP3 Conformity
          color: "#f08c00"
          hoverColor: "#e67700"

    preamble:
      required_fields:
        - bip
        - title
        - author
        - comments_uri
        - status
        - type
        - created
        - license
      optional_fields:
        - layer
        - discussions_to
        - comments_summary
        - license_code
        - post_history
        - requires
        - replaces
        - proposed_replacement
      interrelation_types:
        - requires
        - replaces
        - proposed_replacement
      field_aliases:
        authors: author
        assigned: created
        superseded_by: proposed_replacement
      expected_headlines:
        abstract: 2
        motivation: 2
        specification: 2
        copyright: 2
      list_valued_fields:
        - author
        - license

    classification:
      # Each named dimension maps to the corresponding preamble field.
      # aliases: normalise messy raw values to canonical ones before analysis.
      dimensions:
        status:
          aliases:
            "Draft (Some confusion applies: The announcements for this never made it to the list, so it hasn't had public discussion)": Draft
        type:
          aliases:
            Standard: Standards Track
            Standards: Standards Track
            Standard Track: Standards Track
            Standards-Track: Standards Track
        layer:
          aliases: {}

      # Regimes capture periods where a different classification standard applies.
      # Use valid_from / valid_until (both optional) to bound each period.
      # status_order drives display ordering in paper figures.
      regimes:
        - valid_until: "2026-01-11"
          standard: bip2
          status_order:
            - Draft
            - Proposed
            - Rejected
            - Withdrawn
            - Deferred
            - Final
            - Active
            - Replaced
            - Obsolete
        - valid_from: "2026-01-12"
          standard: bip3
          status_order:
            - Draft
            - Complete
            - Deployed
            - Closed

  slips:
    display_name: SatoshiLabs Improvement Proposals
    proposal_acronym: SLIP
    proposal_term_singular: SatoshiLabs Improvement Proposal
    proposal_term_plural: SatoshiLabs Improvement Proposals

    source_type: github_repo
    harvester: github_repo
    preprocessor: rfc_preamble
    compliance_checker: slip
    repository_owner: satoshilabs
    repository_name: slips

    harvest: ip_data/bitcoin/slips/01_harvest
    preprocess: ip_data/bitcoin/slips/02_preprocess
    analysis: ip_data/bitcoin/slips/03_analysis
    postprocess: ip_data/bitcoin/slips/04_postprocess

    document_prefix: slip
    primary_id_field: slip
    document_file_pattern: '^slip-\d{4}\.md$'
    document_dir_pattern: '^slip-\d{4}$'
    reference_pattern: '\bSLIP[-#\s]?(\d+)\b'
    max_proposal_id: 9999
    stop_words_file: assets/stopwords/en_basic.txt
    frontend:
      compliance_standards: []

    preamble:
      required_fields:
        - slip
        - title
        - author
        - status
        - type
        - created
      optional_fields: []
      interrelation_types: []
      field_aliases:
        number: slip
        authors: author
      expected_headlines:
        abstract: 2
      list_valued_fields:
        - author

    classification:
      dimensions:
        status:
          aliases: {}
        type:
          aliases: {}
      regimes: []
